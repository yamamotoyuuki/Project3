# ================================================================
# .github/workflows/ci.yml
# PC管理システム CI パイプライン
#
# トリガー:
#   - main / develop ブランチへの push
#   - 上記ブランチへの Pull Request
#
# ジョブ:
#   1. backend-build  : Spring Boot のビルド・テスト（Java 21 / Gradle）
#   2. frontend-build : Vue SPA のビルド・型チェック（Node.js 20 / npm）
#   3. docker-build   : Docker イメージのビルド確認（push はしない）
# ================================================================

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:

  # ==============================================================
  # ジョブ 1: バックエンドビルド・テスト
  # ==============================================================
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    # MySQL サービスコンテナ（統合テスト用）
    services:
      mysql:
        image: mysql:9.0.7
        env:
          MYSQL_ROOT_PASSWORD: pass
          MYSQL_DATABASE: project3_test
        # ヘルスチェック: MySQL が起動するまで待機
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306

    steps:
      # ソースコードをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # Java 21 (Amazon Corretto) をセットアップ
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      # Gradle キャッシュ（ビルド時間短縮）
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Gradle Wrapper に実行権限を付与
      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew
        working-directory: ${{ github.workspace }}

      # Spring Boot のビルドとテストを実行
      # application-test.yml を使用してテスト用 MySQL に接続
      - name: Build and test with Gradle
        run: ./gradlew build --no-daemon
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/project3_test?allowPublicKeyRetrieval=true&sslMode=DISABLED
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: pass

      # テストレポートをアーティファクトとして保存（失敗時の原因調査用）
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always() # テスト失敗時もアップロード
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/

  # ==============================================================
  # ジョブ 2: フロントエンドビルド・型チェック
  # ==============================================================
  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node.js 20 をセットアップ（npm キャッシュ有効化）
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-web/package-lock.json

      # 依存パッケージをインストール
      - name: Install dependencies
        run: npm ci
        working-directory: frontend-web

      # TypeScript 型チェック（エラーがあればビルド失敗）
      - name: Type check
        run: node_modules/.bin/vue-tsc --noEmit
        working-directory: frontend-web

      # 本番ビルド（dist/ に出力）
      - name: Build
        run: npm run build
        working-directory: frontend-web

  # ==============================================================
  # ジョブ 3: Docker イメージビルド確認
  # （push はしない。イメージの構成が壊れていないか確認のみ）
  # ==============================================================
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [ backend-build, frontend-build ] # 両ジョブ成功後に実行

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Docker Buildx をセットアップ（マルチプラットフォームビルド対応）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # バックエンドの Docker イメージをビルド（push なし）
      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: pcmgmt-backend:ci

      # フロントエンドの Docker イメージをビルド（push なし）
      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-web
          push: false
          tags: pcmgmt-frontend:ci
