# ==============================================================
# nginx.conf
# frontend-web コンテナの nginx 設定ファイル
#
# - ポート 80 で静的ファイル（Vue SPA）を配信する
# - Vue Router の HTML5 History モードに対応（try_files でフォールバック）
# - /api/* は docker-compose ネットワーク経由でバックエンドにプロキシ転送
# - gzip 圧縮でネットワーク転送量を削減する
# ==============================================================

server {
    # リッスンポート（Dockerfile の EXPOSE と一致させる）
    listen 80;

    # server_name: '_' はワイルドカード（すべてのホスト名にマッチ）
    server_name _;

    # 公開ルートディレクトリ（Dockerfile で dist/ をコピーした場所）
    root /usr/share/nginx/html;

    # デフォルトインデックスファイル
    index index.html;

    # ==============================================================
    # SPA 対応: HTML5 History モードのルーティング
    # Vue Router が管理するすべてのパスを index.html にフォールバックさせる
    # （ブラウザ直接アクセス・リロード時に 404 が出ないようにする）
    # ==============================================================
    location / {
        # ファイルが存在すれば返し、なければ index.html にフォールバック
        try_files $uri $uri/ /index.html;
    }

    # ==============================================================
    # API プロキシ: バックエンドへの転送
    # /api/ で始まるリクエストを Spring Boot バックエンド（8080）に転送する
    # docker-compose のサービス名（backend）で名前解決される
    # ==============================================================
    location /api/ {
        proxy_pass http://backend:8080;                          # バックエンドサービスへ転送
        proxy_set_header Host              $host;                # 元のホストヘッダーを維持
        proxy_set_header X-Real-IP         $remote_addr;         # クライアントの実 IP を付与
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for; # プロキシチェーンを付与
    }

    # ==============================================================
    # gzip 圧縮設定
    # テキスト系ファイルを圧縮してネットワーク転送量を削減する
    # ==============================================================
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml;
}
