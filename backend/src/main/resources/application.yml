spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: pcmgmt-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pcmgmt}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true&sslMode=DISABLED
    username: ${DB_USER:pcmgmt}
    password: ${DB_PASSWORD:pcmgmt_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8

mybatis:
  mapper-locations: classpath:com/company/pcmgmt/domain/mapper/**/*.xml
  type-aliases-package: com.company.pcmgmt.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

jwt:
  secret: ${JWT_SECRET:your-super-secret-key-change-in-production-min-256bits}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.company.pcmgmt: DEBUG
    org.springframework.security: INFO

server:
  port: 8080
  servlet:
    context-path: /
