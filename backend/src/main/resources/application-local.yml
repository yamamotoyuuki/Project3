# ローカル動作確認用プロファイル（H2インメモリDB）
# MySQL なしで Spring Boot の起動確認に使用する

spring:
  datasource:
    url: jdbc:h2:mem:pcmgmt;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis:
  mapper-locations: classpath:com/company/pcmgmt/domain/mapper/*.xml
  type-aliases-package: com.company.pcmgmt.domain.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: local-dev-secret-key-at-least-32-bytes-long
  expiration: 86400000

logging:
  level:
    com.company.pcmgmt: DEBUG
    org.springframework.security: DEBUG
    org.mybatis: DEBUG
