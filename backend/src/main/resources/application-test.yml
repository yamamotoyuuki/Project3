# ================================================================
# application-test.yml
# テスト環境設定
#
# - H2 インメモリ DB を使用してテストを高速・独立して実行する
# - Flyway マイグレーションは自動適用（テスト DB を初期化）
# - ログレベルを DEBUG に設定してテスト中の SQL を可視化する
# ================================================================

spring:
  datasource:
    # H2 インメモリ DB（テスト終了後に自動削除）
    # MySQL 互換モード（MODE=MySQL）を有効にして本番 SQL との差異を最小化
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    # テスト用 DB にも Flyway マイグレーションを適用する
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

# JWT 設定（テスト用の固定シークレット）
jwt:
  secret: test-secret-key-for-testing-purposes-must-be-256bits-long-xxxxxxxxxx
  expiration: 3600000  # テスト用: 1 時間

logging:
  level:
    com.company.pcmgmt: DEBUG
    org.mybatis: DEBUG
    org.springframework.security: WARN  # テスト時は Security ログを抑制
