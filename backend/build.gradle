plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.company'
version = '1.0.0'

/**
 * Java ツールチェーン設定
 *
 * Amazon Corretto 21 を使用する。
 * Gradle がビルドに使用する JDK ディストリビューション・バージョンを明示的に指定する。
 * sourceCompatibility / targetCompatibility はツールチェーンが自動設定するため不要。
 */
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)   // Java 21 LTS
        vendor = JvmVendorSpec.AMAZON                  // Amazon Corretto
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // AOP は追加不要: HandlerInterceptor で操作ログを実現

    // MyBatis
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'

    // MySQL（9.1.0: MySQL 9.0.x 対応版）
    runtimeOnly 'com.mysql:mysql-connector-j:9.1.0'

    // Flyway (DB migration)
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Apache POI (Excel export)
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    // OpenCSV
    implementation 'com.opencsv:opencsv:5.9'

    // H2 (ローカル動作確認用インメモリDB)
    runtimeOnly 'com.h2database:h2'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.3'
}

tasks.named('test') {
    useJUnitPlatform()
}

/**
 * Java コンパイルオプション
 *
 * -parameters: メソッド引数名をクラスファイルに保持する。
 * Spring Framework 6 以降（Spring Boot 3.x）では、
 * @PathVariable / @RequestParam 等のアノテーションで引数名を明示しない場合、
 * このフラグがないとリフレクションで引数名を解決できずエラーになる。
 */
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}

// Fat JAR
jar {
    enabled = false
}
