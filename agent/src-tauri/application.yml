# ================================================================
# PC管理エージェント 設定ファイル
# ================================================================
# このファイルはエージェントアプリが使用するバックエンドAPIの接続情報を定義します。
# 管理者が本番環境のURLに変更して配布してください。
# ================================================================

agent:
  api:
    # バックエンドAPIのベースURL
    # 例（開発環境）: http://localhost:8080/api/v1
    # 例（本番環境）: https://管理サーバーのホスト名/api/v1
    base-url: http://localhost:8080/api/v1
