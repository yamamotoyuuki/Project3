<!DOCTYPE html>
<!--
  index.html
  PC管理エージェント（Tauri）の HTML エントリーポイント
  Vite によって src/main.ts が読み込まれ、Vue アプリが #app にマウントされる
-->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PC管理エージェント</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Segoe UI', sans-serif; }
    </style>
  </head>
  <body>
    <!-- Vue アプリのマウントポイント -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
