<?xml version="1.0" encoding="UTF-8"?>
<!-- icon-warning.svg: Warning triangle icon used in the new-registration confirmation modal -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18">
  <!-- Warning triangle (amber fill) -->
  <polygon points="12,2 22,20 2,20" fill="#d97706"/>
  <!-- Exclamation mark - vertical bar -->
  <rect x="11" y="7.5" width="2" height="7" rx="1" fill="white"/>
  <!-- Exclamation mark - dot -->
  <circle cx="12" cy="17.5" r="1" fill="white"/>
</svg>
